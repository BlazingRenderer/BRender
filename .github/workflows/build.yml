name: build

on:
  - push
  - pull_request

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix flake check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        installable:
          - "brender"
          - "brender-samples"
          - "brender-samples-clang"
          - "brender-samples-linux32"
          - "brender-samples-win64"
          - "brender-samples-win32"
          - "brender-dos-i586"
          - "brender-dos-i686"
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build -L .#${{matrix.installable}}

  # Every commit has to compile and pass on its own, not just the tip. This is
  # a full configure, build and corpus run per commit, so it is pull requests
  # only and not part of the push path.
  verify-series:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and check every commit
        run: |
          nix develop .#rendertest --command bash -c '
            contrib/verify-series.sh "${{ github.event.pull_request.base.sha }}..HEAD"
          '

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends libsdl2-dev libglfw3-dev ninja-build glslang-tools spirv-cross
      - name: Clone Repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Ninja Multi-Config" -DBRENDER_BUILD_GLFW_EXAMPLE=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install
        run: sudo cmake --install build --config Release --strip
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  build-macos:
    runs-on: macos-26
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install cmake sdl3 glslang spirv-cross

      - name: Configure
        run: cmake -B build -G "Ninja Multi-Config"

      - name: Build
        run: cmake --build build --config Release --parallel

  build-msvc2022:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    strategy:
      matrix:
        configuration:
          - { platform: 'x64',   vcpkg_target: 'x64-windows', sdl: 'sdl3' }
          - { platform: 'x64',   vcpkg_target: 'x64-windows', sdl: 'sdl2' }
          - { platform: 'Win32', vcpkg_target: 'x86-windows', sdl: 'sdl3' }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install glslang
        run: vcpkg install glslang[tools]:${{ matrix.configuration.vcpkg_target }}

      - name: Install spirv-cross
        run: vcpkg install spirv-cross:${{ matrix.configuration.vcpkg_target }}

      - name: Install SDL
        run: vcpkg install ${{ matrix.configuration.sdl }}:${{ matrix.configuration.vcpkg_target }}

      - name: Install GLFW3
        run: vcpkg install glfw3:${{ matrix.configuration.vcpkg_target }}

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.configuration.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      #
      # The installed tree has to work from a prefix other than the one it was
      # configured with, which is what a packager passes: `cmake --install
      # --prefix` moves the files, and anything that recorded the configure-time
      # path at generate time (the pkg-config files did) then points at a
      # directory that does not exist. The consumer build is the other half -
      # find_package() on that prefix and a link through the exported target.
      #
      - name: Install to a scratch prefix and consume the package
        shell: pwsh
        run: |
          $inst = Join-Path $env:RUNNER_TEMP 'brender-install'
          $cfg  = (Select-String -Path build\CMakeCache.txt -Pattern '^CMAKE_INSTALL_PREFIX:PATH=(.*)$').Matches[0].Groups[1].Value
          Write-Host "configure-time prefix: $cfg"

          cmake --install build --config Release --prefix $inst
          if ($LASTEXITCODE -ne 0) { throw 'the install failed' }

          $pc = @(Get-ChildItem -Recurse $inst -Filter *.pc -ErrorAction SilentlyContinue)
          if ($pc.Count -eq 0) { throw "no pkg-config files were installed under $inst" }

          $leak = @(Get-ChildItem -Recurse $inst -File | Select-String -SimpleMatch $cfg -List)
          if ($leak.Count -ne 0) { throw "$($leak[0].Path) names the configure-time prefix" }

          cmake -S cmake/consume-test -B consume-build -A ${{ matrix.configuration.platform }} `
                -DCMAKE_PREFIX_PATH="$inst"
          if ($LASTEXITCODE -ne 0) { throw 'the consumer could not find the installed package' }

          cmake --build consume-build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'the consumer did not build' }
