name: build

on:
  - push
  - pull_request

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix flake check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        installable:
          - "brender"
          - "brender-samples"
          - "brender-samples-clang"
          - "brender-samples-linux32"
          - "brender-samples-win64"
          - "brender-samples-win32"
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v20
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build -L .#${{matrix.installable}}

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends libsdl2-dev libglfw3-dev ninja-build glslang-tools spirv-cross

          curl -sSL https://github.com/BlazingRenderer/h2inc/releases/download/v1.0.0/h2inc_Linux_x86_64.tar.gz | sudo tar -C /bin -xz h2inc
      - name: Clone Repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Ninja Multi-Config" -DBRENDER_BUILD_GLFW_EXAMPLE=ON -DBRENDER_H2INC_EXECUTABLE=/bin/h2inc
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install
        run: sudo cmake --install build --config Release --strip

  build-macos:
    runs-on: macos-26
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install cmake sdl3 glslang spirv-cross

      - name: Configure
        run: cmake -B build -G "Ninja Multi-Config"

      - name: Build
        run: cmake --build build --config Release --parallel

  build-msvc2022:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    strategy:
      matrix:
        configuration:
          - { platform: 'x64',   soft: 'OFF', vcpkg_target: 'x64-windows', sdl: 'sdl3' }
          - { platform: 'x64',   soft: 'OFF', vcpkg_target: 'x64-windows', sdl: 'sdl2' }
          - { platform: 'Win32', soft: 'OFF', vcpkg_target: 'x86-windows', sdl: 'sdl3' }
          - { platform: 'Win32', soft: 'ON',  vcpkg_target: 'x86-windows', sdl: 'sdl3' }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Install h2inc
        shell: pwsh
        run: |
          curl.exe -sSL -o "${env:RUNNER_TEMP}\h2inc.zip" `
            'https://github.com/BlazingRenderer/h2inc/releases/download/v1.0.0/h2inc_Windows_x86_64.zip'
          Expand-Archive -Path "${env:RUNNER_TEMP}\h2inc.zip" -DestinationPath "${env:RUNNER_TEMP}\h2inc" -Force

      - name: Install glslang
        run: vcpkg install glslang[tools]:${{ matrix.configuration.vcpkg_target }}

      - name: Install spirv-cross
        run: vcpkg install spirv-cross:${{ matrix.configuration.vcpkg_target }}

      - name: Install SDL
        run: vcpkg install ${{ matrix.configuration.sdl }}:${{ matrix.configuration.vcpkg_target }}

      - name: Install GLFW3
        run: vcpkg install glfw3:${{ matrix.configuration.vcpkg_target }}

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.configuration.platform }}
          -DBRENDER_BUILD_SOFT=${{ matrix.configuration.soft }}
          -DBRENDER_H2INC_EXECUTABLE="${env:RUNNER_TEMP}\h2inc\h2inc.exe"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel
